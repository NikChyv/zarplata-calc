name: Проверка калькулятора

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Жёсткая проверка: без корректного блока настроек страница не работает вообще.
      - name: Блок настроек
        run: node check-config.js

      # Контрольные примеры расчёта. Ожидаемые суммы привязаны к ставкам 2026 года:
      # после обновления ставок этот шаг закономерно упадёт — значит, пора
      # пересчитать ожидаемые значения в test.js, а не игнорировать красный крест.
      - name: Расчёт зарплаты
        run: node test.js

      # Гоняется на обезличенном «Табель-пример.xls», который лежит в репозитории.
      - name: Расчёт численности
        run: node test-headcount.js
